<div class="flex flex-col items-center text-center py-12 text-gray-400 dark:text-gray-500">
  <app-icon [name]="icon" class="mb-3 text-gray-300 dark:text-gray-600"></app-icon>
  <p class="text-sm">{{ message }}</p>
  @if (ctaLabel && ctaLink) {
    <a [routerLink]="ctaLink" class="text-indigo-600 text-sm mt-2 inline-block hover:underline">
      {{ ctaLabel }}
    </a>
  }
</div>

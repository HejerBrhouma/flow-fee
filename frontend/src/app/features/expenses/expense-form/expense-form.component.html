<div class="p-6 max-w-2xl mx-auto">

  <h2 class="text-2xl font-bold text-gray-800 mb-6">
    {{ isEdit ? 'Modifier la dépense' : 'Nouvelle dépense' }}
  </h2>

  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Titre *</label>
        <input formControlName="title" type="text" placeholder="Ex: Déjeuner client"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Montant *</label>
          <input formControlName="amount" type="number" step="0.01" min="0.01" placeholder="0.00"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Devise</label>
          <select formControlName="currency"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="EUR">EUR €</option>
            <option value="USD">USD $</option>
            <option value="GBP">GBP £</option>
            <option value="TND">TND د.ت</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date de la dépense *</label>
        <input formControlName="expenseDate" type="date"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea formControlName="description" rows="3" placeholder="Détails optionnels..."
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none">
        </textarea>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <a routerLink="/expenses"
          class="px-4 py-2.5 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
          Annuler
        </a>
        <button type="submit" [disabled]="loading || form.invalid"
          class="px-4 py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition disabled:opacity-50">
          {{ loading ? 'Enregistrement...' : (isEdit ? 'Mettre à jour' : 'Créer') }}
        </button>
      </div>
    </form>
  </div>
</div>

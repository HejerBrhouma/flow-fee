<div class="p-6 max-w-2xl mx-auto">

  <h2 class="text-2xl font-bold text-gray-800 mb-6 dark:text-gray-100">
    {{ isEdit ? 'Modifier la dépense' : 'Nouvelle dépense' }}
  </h2>

  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 dark:bg-gray-800 dark:border-gray-700">
    @if (!isEdit) {
      <label
        class="flex items-center justify-center gap-2 w-full border-2 border-dashed border-indigo-200 rounded-lg px-4 py-3 mb-5 text-sm font-medium text-indigo-600 hover:bg-indigo-50 transition cursor-pointer dark:border-indigo-500/30 dark:hover:bg-indigo-500/10"
        [class.opacity-50]="scanningReceipt" [class.pointer-events-none]="scanningReceipt">
        📷 {{ scanningReceipt ? 'Analyse du reçu en cours...' : 'Scanner un reçu pour pré-remplir le formulaire' }}
        <input type="file" accept="image/*" capture="environment" class="hidden" (change)="onReceiptSelected($event)">
      </label>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-200">Titre *</label>
        <input formControlName="title" type="text" placeholder="Ex: Déjeuner client"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-200">
          Montant * <span class="text-gray-400 font-normal dark:text-gray-500">({{ form.value.currency }})</span>
        </label>
        <input formControlName="amount" type="number" step="0.01" min="0.01" placeholder="0.00"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
        <p class="text-xs text-gray-400 mt-1 dark:text-gray-500">
          Devise définie dans <a routerLink="/profile" class="text-indigo-600 hover:underline">votre profil</a>.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-200">Catégorie</label>
        <select formControlName="categoryId" (change)="onCategoryChange()"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
          <option [ngValue]="null">Aucune catégorie</option>
          @for (category of categories; track category.id) {
            <option [ngValue]="category.id">{{ category.icon }} {{ category.name }}</option>
          }
        </select>
        @if (suggestedCategoryId && form.value.categoryId === suggestedCategoryId) {
          <p class="text-xs text-indigo-500 mt-1">Catégorie suggérée automatiquement — modifiable.</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-200">Date de la dépense *</label>
        <input formControlName="expenseDate" type="date"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-200">Description</label>
        <textarea formControlName="description" rows="3" placeholder="Détails optionnels..."
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
        </textarea>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <a routerLink="/expenses"
          class="px-4 py-2.5 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition dark:border-gray-600 dark:text-gray-200 dark:hover:bg-gray-700">
          Annuler
        </a>
        <button type="submit" [disabled]="loading || form.invalid"
          class="px-4 py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition disabled:opacity-50">
          {{ loading ? 'Enregistrement...' : (isEdit ? 'Mettre à jour' : 'Créer') }}
        </button>
      </div>
    </form>
  </div>
</div>

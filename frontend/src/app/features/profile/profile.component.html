<div class="p-6 max-w-lg mx-auto">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Mon profil</h2>

  @if (authService.currentUser; as user) {
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-4">

      <div class="flex items-center gap-4">
        <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-xl">
          {{ user.firstName[0] }}{{ user.lastName[0] }}
        </div>
        <div>
          <p class="text-xl font-semibold text-gray-800">{{ user.fullName }}</p>
          <p class="text-sm text-gray-500">{{ user.email }}</p>
        </div>
      </div>

      <div class="border-t pt-4 space-y-2">
        <div class="flex justify-between">
          <span class="text-gray-500 text-sm">Type de compte</span>
          <span class="font-medium text-sm capitalize">
            {{ user.type === 'personal' ? 'Particulier' : 'Professionnel' }}
          </span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500 text-sm">Membre depuis</span>
          <span class="font-medium text-sm">{{ user.createdAt | date:'MMMM yyyy':'':'fr' }}</span>
        </div>
      </div>

      <div class="border-t pt-4">
        <button (click)="authService.logout()"
          class="w-full border border-red-300 text-red-600 rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-red-50 transition">
          Se déconnecter
        </button>
      </div>
    </div>
  }
</div>

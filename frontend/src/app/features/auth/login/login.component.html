<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-600">{{ 'login.title' | translate }}</h1>
      <p class="text-gray-500 mt-2">{{ 'login.subtitle' | translate }}</p>
    </div>

    <!-- OAuth buttons -->
    <div class="space-y-3 mb-6">
      <button (click)="loginWithGoogle()"
        class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-lg px-4 py-2.5 hover:bg-gray-50 transition">
        <img src="assets/icons/google.svg" alt="Google" class="w-5 h-5">
        <span class="text-sm font-medium text-gray-700">{{ 'login.continueWithGoogle' | translate }}</span>
      </button>
      <button (click)="loginWithFacebook()"
        class="w-full flex items-center justify-center gap-3 bg-blue-600 rounded-lg px-4 py-2.5 hover:bg-blue-700 transition">
        <img src="assets/icons/facebook.svg" alt="Facebook" class="w-5 h-5">
        <span class="text-sm font-medium text-white">{{ 'login.continueWithFacebook' | translate }}</span>
      </button>
    </div>

    <div class="flex items-center gap-3 mb-6">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-sm text-gray-400">{{ 'login.or' | translate }}</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <!-- Login form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'login.email' | translate }}</label>
        <input formControlName="email" type="email" [placeholder]="'login.emailPlaceholder' | translate"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched">
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <p class="text-red-500 text-xs mt-1">{{ 'login.emailInvalid' | translate }}</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'login.password' | translate }}</label>
        <input formControlName="password" type="password" placeholder="••••••••"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched">
      </div>

      <button type="submit" [disabled]="loading"
        class="w-full bg-indigo-600 text-white rounded-lg px-4 py-2.5 font-medium hover:bg-indigo-700 transition disabled:opacity-50">
        {{ (loading ? 'login.submitting' : 'login.submit') | translate }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      {{ 'login.noAccount' | translate }}
      <a routerLink="/auth/register" class="text-indigo-600 font-medium hover:underline">{{ 'login.signUp' | translate }}</a>
    </p>
  </div>
</div>

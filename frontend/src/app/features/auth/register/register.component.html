<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 dark:bg-gray-800">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-600">Flow Fee</h1>
      <p class="text-gray-500 mt-2 dark:text-gray-400">Créer votre compte</p>
    </div>

    <!-- OAuth buttons -->
    <div class="space-y-3 mb-6">
      <button type="button" (click)="registerWithGoogle()"
        class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-lg px-4 py-2.5 hover:bg-gray-50 transition dark:border-gray-600 dark:hover:bg-gray-700">
        <img src="assets/icons/google.svg" alt="Google" class="w-5 h-5">
        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Continuer avec Google</span>
      </button>
      <button type="button" (click)="registerWithFacebook()"
        class="w-full flex items-center justify-center gap-3 bg-blue-600 rounded-lg px-4 py-2.5 hover:bg-blue-700 transition">
        <img src="assets/icons/facebook.svg" alt="Facebook" class="w-5 h-5">
        <span class="text-sm font-medium text-white">Continuer avec Facebook</span>
      </button>
    </div>

    <div class="flex items-center gap-3 mb-6">
      <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
      <span class="text-sm text-gray-400 dark:text-gray-500">ou</span>
      <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Account type -->
      <div class="grid grid-cols-2 gap-3">
        <label class="relative cursor-pointer">
          <input type="radio" formControlName="type" value="personal" class="sr-only">
          <div class="border-2 rounded-lg p-3 text-center transition"
            [ngClass]="form.get('type')?.value === 'personal' ? 'border-indigo-500' : 'border-gray-200 dark:border-gray-600'">
            <span class="text-lg">👤</span>
            <p class="text-sm font-medium mt-1 text-gray-700 dark:text-gray-100">Particulier</p>
          </div>
        </label>
        <label class="relative cursor-pointer">
          <input type="radio" formControlName="type" value="professional" class="sr-only">
          <div class="border-2 rounded-lg p-3 text-center transition"
            [ngClass]="form.get('type')?.value === 'professional' ? 'border-indigo-500' : 'border-gray-200 dark:border-gray-600'">
            <span class="text-lg">🏢</span>
            <p class="text-sm font-medium mt-1 text-gray-700 dark:text-gray-100">Professionnel</p>
          </div>
        </label>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-200">Prénom</label>
          <input formControlName="firstName" type="text" placeholder="Jean"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-200">Nom</label>
          <input formControlName="lastName" type="text" placeholder="Dupont"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-200">Email</label>
        <input formControlName="email" type="email" placeholder="vous@exemple.com"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-200">Mot de passe</label>
        <input formControlName="password" type="password" placeholder="Minimum 8 caractères"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
        @if (form.get('password')?.errors?.['minlength'] && form.get('password')?.touched) {
          <p class="text-red-500 text-xs mt-1">Minimum 8 caractères.</p>
        }
      </div>

      <button type="submit" [disabled]="loading"
        class="w-full bg-indigo-600 text-white rounded-lg px-4 py-2.5 font-medium hover:bg-indigo-700 transition disabled:opacity-50">
        {{ loading ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6 dark:text-gray-400">
      Déjà un compte ?
      <a routerLink="/auth/login" class="text-indigo-600 font-medium hover:underline">Se connecter</a>
    </p>
  </div>
</div>

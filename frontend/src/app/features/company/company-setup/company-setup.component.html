<div class="p-6 max-w-xl mx-auto">
  <h2 class="text-2xl font-bold text-gray-800 mb-2">Créer votre entreprise</h2>
  <p class="text-gray-500 mb-6">Configurez votre espace professionnel.</p>

  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nom de l'entreprise *</label>
        <input formControlName="name" type="text" placeholder="Ma Société SAS"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">SIRET</label>
        <input formControlName="siret" type="text" placeholder="12345678901234"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
        <input formControlName="address" type="text"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ville</label>
          <input formControlName="city" type="text"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Code postal</label>
          <input formControlName="zipCode" type="text"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <button type="submit" [disabled]="loading || form.invalid"
        class="w-full bg-indigo-600 text-white rounded-lg px-4 py-2.5 font-medium hover:bg-indigo-700 transition disabled:opacity-50">
        {{ loading ? 'Création...' : 'Créer l\'entreprise' }}
      </button>
    </form>
  </div>
</div>

<button (click)="themeService.toggle()" type="button" title="Changer de thème"
  class="w-9 h-9 flex items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition dark:text-gray-400 dark:hover:bg-gray-700">
  <app-icon [name]="themeService.current === 'dark' ? 'sun' : 'moon'"></app-icon>
</button>

<div class="relative">
  @if (open) {
    <div class="absolute bottom-full left-0 right-0 mb-2 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden z-50">
      <div class="px-4 py-3 border-b border-gray-100">
        <p class="text-sm font-semibold text-gray-800 truncate">{{ authService.currentUser?.fullName }}</p>
        <p class="text-xs text-gray-400 truncate">{{ authService.currentUser?.email }}</p>
      </div>

      <a routerLink="/profile" (click)="close()"
        class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition">
        <app-icon name="profile"></app-icon>
        {{ 'accountMenu.editProfile' | translate }}
      </a>

      <button (click)="logout()" type="button"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition border-t border-gray-100">
        <app-icon name="logout"></app-icon>
        {{ 'accountMenu.logout' | translate }}
      </button>
    </div>
  }

  <button (click)="toggle()" type="button"
    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-50 transition">
    <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-semibold text-sm shrink-0">
      {{ authService.currentUser?.firstName?.[0] }}{{ authService.currentUser?.lastName?.[0] }}
    </div>
    <div class="flex-1 min-w-0 text-left">
      <p class="text-sm font-medium text-gray-800 truncate">{{ authService.currentUser?.fullName }}</p>
      <p class="text-xs text-gray-400 truncate">{{ authService.currentUser?.email }}</p>
    </div>
    <app-icon name="chevron" class="text-gray-400 shrink-0"></app-icon>
  </button>
</div>

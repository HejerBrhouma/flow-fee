security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/auth/login_check
            stateless: true
            json_login:
                check_path: /api/auth/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        oauth:
            pattern: ^/api/auth/oauth
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\OAuthAuthenticator

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/auth/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/oauth, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/2fa/verify, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        ROLE_EMPLOYEE: ROLE_USER
        ROLE_MANAGER: ROLE_EMPLOYEE
        ROLE_COMPANY_ADMIN: ROLE_MANAGER
        ROLE_SUPER_ADMIN: ROLE_COMPANY_ADMIN

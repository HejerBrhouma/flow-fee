version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: flow-fee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flow_fee
      MYSQL_USER: flow_fee_user
      MYSQL_PASSWORD: flow_fee_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - flow-fee-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: flow-fee-phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: flow_fee_user
      PMA_PASSWORD: flow_fee_pass
      UPLOAD_LIMIT: 50M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - flow-fee-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flow-fee-backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://flow_fee_user:flow_fee_pass@mysql:3306/flow_fee?serverVersion=8.0&charset=utf8mb4
      APP_ENV: dev
      APP_SECRET: flow_fee_dev_secret_32_chars_min
      JWT_PASSPHRASE: flow_fee_jwt_passphrase
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
    networks:
      - flow-fee-network
    command: >
      sh -c "
        [ -d vendor ] || composer install &&
        mkdir -p config/jwt var/cache var/log public/uploads &&
        ([ -f config/jwt/private.pem ] || php bin/console lexik:jwt:generate-keypair --skip-if-exists) &&
        php bin/console cache:clear --no-warmup &&
        php bin/console doctrine:database:create --if-not-exists &&
        php bin/console doctrine:migrations:migrate --no-interaction || true &&
        php -S 0.0.0.0:8000 -t public
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flow-fee-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - flow-fee-network

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: flow-fee-mobile
    ports:
      - "8100:8100"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    networks:
      - flow-fee-network

networks:
  flow-fee-network:
    driver: bridge

volumes:
  mysql_data:
